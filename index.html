<!DOCTYPE html>
<html>
<head>
  <title>Be My Girlfriend?</title>
  <style>
    body {
      text-align: center;
      font-family: 'Poppins', sans-serif;
      margin-top: 100px;
      background: radial-gradient(circle at center, #00c6ff, #0072ff);
      color: #fff;
      overflow: hidden;
    }
    h1 {
      font-size: 42px;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(0,255,255,0.8), 0 0 30px rgba(0,0,255,0.6);
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #00f, 0 0 20px #0ff; }
      to { text-shadow: 0 0 20px #0ff, 0 0 40px #00f; }
    }
    button {
      padding: 16px 32px;
      font-size: 22px;
      margin: 20px;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      background: linear-gradient(145deg, #00f, #0ff);
      color: white;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    button:hover {
      transform: scale(1.15);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }
    #noBtn {
      position: absolute;
      background: linear-gradient(145deg, #ff416c, #ff4b2b);
    }
    #yesBtn {
      background: linear-gradient(145deg, #28a745, #00ff88);
    }
    /* Watery ripple effect */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://www.transparenttextures.com/patterns/water.png');
      opacity: 0.2;
      animation: wave 10s linear infinite;
    }
    @keyframes wave {
      from { transform: translateX(0); }
      to { transform: translateX(-200px); }
    }
  </style>
</head>
<body>
  <h1>💧 Will you be my girlfriend? 💞</h1>
  <button id="yesBtn">YES 🌊</button>
  <button id="noBtn">NO 💦</button>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth));
      const y = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight));
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      alert("Yay! 💖 You said YES! 🌊✨");
    });
  </script>
</body>
</html>
