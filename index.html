<!DOCTYPE html>
<html>
<head>
  <title>Be My Girlfriend?</title>
  <style>
    body {
      text-align: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: radial-gradient(circle at center, #00c6ff, #0072ff);
      color: #fff;
      overflow: hidden;
    }
    h1 {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 48px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 2px 2px 6px #000, 0 0 20px #0ff;
      -webkit-text-stroke: 1px #000;
      animation: glow 2s infinite alternate;
      z-index: 1000;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #00f, 0 0 20px #0ff; }
      to { text-shadow: 0 0 20px #0ff, 0 0 40px #00f; }
    }
    .buttons {
      margin-top: 120px;
    }
    button {
      padding: 16px 32px;
      font-size: 22px;
      margin: 20px;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      color: white;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    button:hover {
      transform: scale(1.15);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }
    #yesBtn {
      background: linear-gradient(145deg, #28a745, #00ff88);
    }
    #noBtn {
      background: linear-gradient(145deg, #ff416c, #ff4b2b);
      position: absolute;
    }
    .confetti, .tear {
      position: fixed;
      font-size: 24px;
      animation: fall 2s linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>💧 Will you be my girlfriend? 💞</h1>
  <div class="buttons">
    <button id="yesBtn">YES 🎉</button>
    <button id="noBtn">NO 😢</button>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    // Move NO button around playfully
    noBtn.addEventListener("mouseover", () => {
      const x = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth));
      const y = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight));
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // YES button → Party poppers 🎉
    yesBtn.addEventListener("click", () => {
      for (let i = 0; i < 25; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.innerText = "🎉";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = "-30px";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2000);
      }
      alert("Yay! 💖 You said YES!");
    });

    // NO button → Tears 💧
    noBtn.addEventListener("click", () => {
      for (let i = 0; i < 25; i++) {
        const tear = document.createElement("div");
        tear.className = "tear";
        tear.innerText = "💧";
        tear.style.left = Math.random() * window.innerWidth + "px";
        tear.style.top = "-30px";
        document.body.appendChild(tear);
        setTimeout(() => tear.remove(), 2000);
      }
      alert("😢 You made me cry...");
    });
  </script>
</body>
</html>
